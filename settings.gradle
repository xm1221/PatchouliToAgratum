pluginManagement {
    repositories {
        // CN mirrors first: this machine reaches Aliyun far more reliably than the
        // plugin portal directly.
        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
        maven { url = uri("https://maven.aliyun.com/repository/public") }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "${mod_id}-neoforge"

// Pure-JVM half of the project: Patchouli book model, macro engine, $(...) parser and the
// Markdown writer. Carries no Minecraft dependency, so it can be unit tested offline and
// reused by a standalone CLI.
include 'pta-core'
