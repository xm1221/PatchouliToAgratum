plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

// The conversion core is compiled into this mod rather than depended on as a jar.
//
// MDG builds the dev runtime's classpath from the source sets a mod claims plus a curated
// library list, so a plain `implementation project(':pta-core')` resolves at compile time and
// then fails at runtime with ClassNotFoundException. Compiling the sources directly works in
// dev, in the built jar and in production with no Gradle-specific machinery.
//
// The purity of the core is still enforced by the build: the :pta-core project compiles these
// same sources with no Minecraft on its classpath and runs the offline regression suite, and
// `build` depends on it, so a reference to any game type breaks the build.
sourceSets.main.java.srcDir(project(':pta-core').file('src/main/java'))

repositories {
    // CN mirrors first. This machine's network reaches these far more reliably than the
    // upstream hosts, and everything already in the local cache resolves offline anyway.
    maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }
    maven { url = uri("https://maven.aliyun.com/repository/public") }
    maven { url = uri("https://mirrors.cloud.tencent.com/nexus/repository/maven-public/") }
    mavenCentral()
    gradlePluginPortal()
    // NeoForge
    maven { url = uri("https://maven.neoforged.net/releases") }
    // Patchouli lives here
    maven { url = uri("https://maven.blamejared.com") }
    // Ageratum (AnvilCraft resource) lives here
    maven {
        name = "Ageratum"
        url = uri("https://server.cjsah.net:1002/maven")
    }
    maven { url = uri("https://maven.architectury.dev/") }
    maven { url = uri("https://maven.fabricmc.net/") }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            // data(), not the MDK template's clientData(). MDG resolves a run type by looking it up
            // in the NeoForge userdev config's run map, and NeoForge 21.1.236 declares only
            // client, data, gameTestServer, server and junit. clientData is a DSL method MDG still
            // offers but this NeoForge does not define, so it fails with "Trying to prepare unknown
            // run: clientData". NeoForge's data run already uses the client classpath, which is what
            // datagen needs.
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            // The conversion core's sources are compiled into this source set (see the srcDir
            // below), so the mod is a single unit and needs no runtime classpath entry for it.
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Patchouli is a hard runtime dependency: this mod hosts real Patchouli pages instead of
    // re-implementing them. See docs/01-architecture.md.
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Ageratum is a hard runtime dependency as well: it owns the guide UI we render into.
    compileOnly "dev.anvilcraft.resource:ageratum-neoforge-1.21.1:${ageratum_version}"
    runtimeOnly "dev.anvilcraft.resource:ageratum-neoforge-1.21.1:${ageratum_version}"
}

// Expands the declared properties inside the mod metadata template.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            patchouli_version_range: patchouli_version_range,
            ageratum_version_range : ageratum_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// `gradlew build` has to keep running the core's offline regression suite; it is the only
// automated check this project has.
tasks.named('build') {
    dependsOn ':pta-core:build'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
